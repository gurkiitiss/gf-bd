<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Secret Code</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Dancing+Script:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--pink:#d9577a;--deep:#a8324f;--soft:#fbe3e8;--card:#fff7f8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--deep);overflow:hidden;
  background:
   repeating-linear-gradient(90deg,transparent 0 120px,rgba(217,87,122,.28) 120px 160px),
   repeating-linear-gradient(0deg,transparent 0 120px,rgba(217,87,122,.28) 120px 160px),
   #f6d3d8;}
body.soft{background:radial-gradient(circle at 20% 20%,#ffe9ee,#f9c9d3 70%);}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow-y:auto;text-align:center}
.screen.active{display:flex;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1{font-size:clamp(36px,5.5vw,76px);color:var(--pink);margin-bottom:18px}
#s-gifts p{font-size:clamp(20px,2.4vw,32px)!important}
.hint{font-family:'Patrick Hand',cursive;font-size:20px;margin:14px 0}
/* code */
.dots{display:flex;gap:10px}
.dot{width:58px;height:58px;border:3px solid #222;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:30px;transition:.15s}
.dot.fill{background:#ffd3dc;transform:scale(1.06)}
.pad{background:#fff;border:4px solid #222;border-radius:34px;padding:18px;display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:6px}
.pad button{height:70px;border-radius:14px;border:3px solid var(--deep);background:var(--pink);color:#fff;font:600 26px 'Fredoka';cursor:pointer;box-shadow:0 4px 0 var(--deep);transition:.08s}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.err{height:22px;font-family:'Patrick Hand';font-size:18px}
/* gifts */
.gifts{display:flex;gap:clamp(6px,3vw,40px);margin-top:20px;flex-wrap:wrap;justify-content:center}
.gift{background:none;border:0;cursor:pointer;transition:.25s;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(168,50,79,.25))}
.gift:nth-child(2){animation-delay:.5s}.gift:nth-child(3){animation-delay:1s}
.gift:hover{transform:scale(1.1) rotate(-3deg)}
.gift svg{width:clamp(130px,30vw,400px);display:block}
@keyframes float{50%{translate:0 -12px}}
/* panels */
.panel{background:var(--card);border:3px solid #e48aa0;border-radius:26px;box-shadow:0 10px 30px rgba(168,50,79,.2);padding:26px;max-width:min(900px,95vw);width:100%}
.nextbtn{position:absolute;top:18px;right:18px;background:#fff;border:2px solid #e8a3b3;border-radius:40px;padding:14px 44px;font:600 clamp(20px,1.8vw,28px) 'Fredoka';color:var(--pink);cursor:pointer}
.nextbtn:hover{background:var(--pink);color:#fff}
.tulips{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(16px,2.5vw,40px);align-items:center;max-width:1500px;width:100%}
.bubbles{display:flex;flex-direction:column;gap:clamp(20px,4vh,46px)}
.bubble{background:#fff;border:3px solid #f0b5c2;border-radius:24px;padding:clamp(16px,2.4vh,28px) clamp(14px,1.8vw,28px);font:700 clamp(24px,2.6vw,40px)/1.2 'Dancing Script',cursive;opacity:0;animation:pop .6s forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.bouquet{width:min(clamp(260px,32vw,560px),62vh*0.8);border:3px solid #e48aa0;border-radius:24px;background:#fff;padding:8px;box-shadow:0 8px 22px rgba(168,50,79,.25)}
.bouquet img{display:block;width:100%;border-radius:16px}
.bouquetnote{font:700 clamp(22px,2.2vw,34px)/1.2 'Dancing Script',cursive;color:var(--deep);text-align:center;padding:10px 4px 4px}
.backbtn{position:absolute;top:18px;left:18px;background:#fff;border:2px solid #e8a3b3;border-radius:40px;padding:14px 38px;font:600 clamp(20px,1.8vw,28px) 'Fredoka';color:var(--pink);cursor:pointer;z-index:3}
.backbtn:hover{background:var(--pink);color:#fff}
.letter{--lh:clamp(36px,3.6vw,54px);background:#f6ecd0 repeating-linear-gradient(transparent 0 calc(var(--lh) - 1px),#d9c9a2 calc(var(--lh) - 1px) var(--lh));border-radius:8px;padding:var(--lh) clamp(24px,3vw,60px);text-align:left;font:clamp(24px,2.5vw,38px)/var(--lh) 'Patrick Hand',cursive;color:#5a2b2b;width:min(1100px,94vw);box-shadow:0 10px 26px rgba(0,0,0,.18);white-space:pre-line}
.sign{text-align:right;color:var(--pink);font-weight:600;font-size:clamp(24px,2.6vw,38px);margin-top:14px;width:min(1100px,94vw)}
.row{display:flex;gap:clamp(20px,3vw,60px);align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:1700px}
.row .letter,.row .sign{width:100%}
.lcol{flex:1 1 520px;max-width:1000px}
.cakecol{flex:0 1 clamp(260px,28vw,480px);text-align:center}
.cakewrap{container-type:inline-size;position:relative;width:100%;padding-top:22%;cursor:pointer;filter:drop-shadow(0 12px 14px rgba(120,60,120,.25));transition:.2s}
.cakewrap:hover{transform:scale(1.03)}
.cakewrap .cakebase{display:block;width:100%;border-radius:28px}
/* second copy of the cake on top hides the candle bottoms, so they look stuck in the berries */
.cakewrap .cakefront{position:absolute;left:0;bottom:0;width:100%;border-radius:28px;clip-path:inset(36% 0 0 0);pointer-events:none}
.candle{position:absolute;width:21cqw;top:25cqw}
.candle>img{display:block;width:100%;clip-path:inset(0 0 0 1.5%)}
.candle.c1{left:29%}.candle.c2{left:51%}
.micbtn{margin-top:10px;background:#fff;border:2px solid #e8a3b3;border-radius:40px;padding:10px 26px;font:600 clamp(18px,1.5vw,24px) 'Fredoka';color:var(--pink);cursor:pointer}
.micbtn:hover{background:var(--pink);color:#fff}
.flame{position:absolute;left:44%;top:-8cqw;z-index:2;width:6cqw;height:10cqw;margin-left:-3cqw;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;
  background:radial-gradient(circle at 50% 70%,#fff6b0,#ffc43a 55%,#ff7a2a);box-shadow:0 0 5cqw 2cqw rgba(255,190,60,.7);transform-origin:50% 100%;animation:flick .25s infinite alternate;transition:opacity .4s,transform .4s}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
.cakewrap.out .flame{opacity:0;transform:scale(.2);animation:none}
.blowhint{font:700 clamp(20px,1.8vw,28px) 'Dancing Script',cursive;margin-top:14px}
[hidden]{display:none!important}
.msgcard.note{max-width:min(520px,92vw);animation:notepop .7s cubic-bezier(.3,1.6,.5,1)}
.noteicon{font-size:clamp(50px,6vw,90px);animation:pulse 1.4s ease-in-out infinite}
@keyframes notepop{from{opacity:0;transform:scale(.2) translateY(80px) rotate(-10deg)}to{opacity:1;transform:none}}
/* polaroids on the code page */
#s-code{overflow:hidden}
#s-code>:not(.pbg){position:relative;z-index:2}
.pbg{position:absolute;inset:0;z-index:1;pointer-events:none}
.pol{--w:clamp(96px,12vw,210px);position:absolute;width:var(--w);background:#fff;padding:calc(var(--w)*.05) calc(var(--w)*.05) calc(var(--w)*.17);box-sizing:content-box;border-radius:3px;box-shadow:0 10px 24px rgba(120,30,60,.3);transform:rotate(var(--r));animation:polin .7s cubic-bezier(.3,1.5,.5,1) both,polfloat 5s ease-in-out infinite alternate;animation-delay:var(--d),calc(var(--d) + .7s)}
.pol::before{content:"";position:absolute;left:50%;top:-1.6%;width:34%;height:7%;transform:translateX(-50%) rotate(-3deg);background:rgba(255,182,203,.75);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pol img{display:block;width:100%;aspect-ratio:1/1.05;object-fit:cover;object-position:center 30%;background:#f6d3d8}
@keyframes polin{from{opacity:0;transform:rotate(var(--r)) scale(.4) translateY(30px)}to{opacity:1;transform:rotate(var(--r))}}
@keyframes polfloat{from{translate:0 0}to{translate:0 -8px}}
@media(max-width:900px){.pol.far{display:none}}
@media(max-width:620px){.pol{opacity:.6;--w:84px}}
/* one big "open next gift" button on gift pages */
.gobtn{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:6;background:linear-gradient(#ff6f9f,#e8467c);color:#fff;border:3px solid #fff;border-radius:60px;padding:16px 44px;font:600 clamp(20px,2.4vw,34px) 'Fredoka';cursor:pointer;box-shadow:0 10px 26px rgba(232,70,124,.55);animation:gopulse 1.8s ease-in-out infinite;white-space:nowrap;max-width:94vw}
.gobtn:hover{filter:brightness(1.08)}
@keyframes gopulse{50%{box-shadow:0 10px 36px rgba(232,70,124,.85),0 0 0 8px rgba(255,255,255,.45)}}
#s-0,#s-1,#s-2{padding-bottom:120px}
/* final "turn around" screen + circular wipe transition */
#s-end{background:radial-gradient(circle at 50% 45%,#ff8fb3,#e8467c 60%,#b01e4d);z-index:3;overflow:hidden}
.endtxt{color:#fff;margin:0;line-height:1.05;font-size:clamp(52px,12vw,190px);text-shadow:0 .04em 0 #b01e4d,0 .1em .25em rgba(120,10,50,.45);letter-spacing:.01em}
.endtxt .row2{display:block}
.endtxt .l{display:inline-block;opacity:0;white-space:pre}
#s-end.active .endtxt .l{animation:lpop .55s cubic-bezier(.3,1.7,.5,1) forwards,lwave 1.6s ease-in-out infinite;animation-delay:var(--ld),calc(var(--ld) + .6s)}
@keyframes lpop{from{opacity:0;transform:scale(.2) translateY(40px) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes lwave{50%{transform:translateY(-.08em) rotate(2deg)}}
.wipe{position:fixed;inset:0;z-index:30;pointer-events:none;background:radial-gradient(circle,#ff9fbe,#e8467c);clip-path:circle(0% at 50% 50%)}
.wipe.go{animation:wipein .9s ease-in forwards}
.wipe.out{clip-path:circle(150% at 50% 50%);animation:wipeout .9s ease forwards}
@keyframes wipein{to{clip-path:circle(150% at 50% 50%)}}
@keyframes wipeout{from{opacity:1}to{opacity:0}}
/* locked / next gift states */
.gift.locked{cursor:not-allowed;animation:none;filter:grayscale(.85) brightness(1.05) opacity(.55)}
.gift.locked:hover{transform:none}
.gift.locked::after{content:"🔒";position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font-size:clamp(30px,5vw,70px);filter:none}
.gift{position:relative}
.gift.next:not(.maingift){filter:drop-shadow(0 0 22px rgba(255,70,130,.8)) drop-shadow(0 14px 14px rgba(168,50,79,.25))}
.gift.nope{animation:shake .4s}
.maingift.locked::after{font-size:clamp(50px,8vw,120px)}
.maingift.locked .halo,.maingift.locked .crown,.maingift.locked .sp{animation:none;opacity:.35}
/* gifts layout: one big main gift + three smaller ones */
.mainrow{display:flex;justify-content:center;margin-top:8px}
.gifts .gift svg{width:min(clamp(100px,20vw,280px),21vh)}
.maingift{position:relative;filter:drop-shadow(0 0 26px rgba(255,70,130,.65)) drop-shadow(0 14px 14px rgba(168,50,79,.3))}
.maingift svg{width:min(clamp(200px,34vw,520px),36vh)}
.maingift .halo{position:absolute;inset:-22%;z-index:-1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,120,170,.4) 45%,transparent 70%);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.75}}
.maingift .crown{position:absolute;left:50%;top:-9%;transform:translateX(-50%) rotate(-6deg);font-size:clamp(34px,5.5vw,84px);animation:pulse 2.4s ease-in-out infinite}
.maingift .sp{position:absolute;font-size:clamp(18px,2.4vw,36px);animation:twinkle 1.6s ease-in-out infinite}
.maingift .sp:nth-of-type(1){left:-6%;top:18%}.maingift .sp:nth-of-type(2){right:-6%;top:30%;animation-delay:.5s}.maingift .sp:nth-of-type(3){left:6%;bottom:12%;animation-delay:1s}
@keyframes twinkle{50%{transform:scale(1.6) rotate(20deg);opacity:.4}}
/* main gift page (3D box) */
.stage{--W:64cqw;--D:44cqw;--H:22cqw;--L:9cqw;--m:.8cqw;container-type:inline-size;position:relative;width:min(720px,96vw,66vh);aspect-ratio:1/1;cursor:pointer;margin-top:16px}
.stage>*{position:absolute}
.glow{inset:0;background:radial-gradient(closest-side at 50% 58%,rgba(255,255,255,.9),rgba(255,140,180,.35) 55%,transparent 100%)}
.scene{inset:0;perspective:150cqw;perspective-origin:50% 35%;pointer-events:none}
.sway{position:absolute;left:50%;top:66cqw;width:0;height:0;transform-style:preserve-3d;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotateY(-4deg) translateY(0)}to{transform:rotateY(4deg) translateY(-1.2cqw)}}
.open .sway{animation:none}
.box3d{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-26deg) rotateY(-24deg);transition:transform 1.2s ease}
.open .box3d{transform:rotateX(-42deg) rotateY(-14deg)}
.f{position:absolute;backface-visibility:visible}
.front{width:var(--W);height:var(--H);left:calc(var(--W)/-2);top:calc(var(--H)/-2);transform:translateZ(calc(var(--D)/2));background:linear-gradient(#fdf1f5,#f8dde6);border:.5cqw solid #e9a9bb;border-radius:0 0 1cqw 1cqw}
.back{width:var(--W);height:var(--H);left:calc(var(--W)/-2);top:calc(var(--H)/-2);transform:rotateY(180deg) translateZ(calc(var(--D)/2));background:linear-gradient(#f4b3c6,#f9d3de);border:.5cqw solid #e48aa0}
.left{width:var(--D);height:var(--H);left:calc(var(--D)/-2);top:calc(var(--H)/-2);transform:rotateY(-90deg) translateZ(calc(var(--W)/2));background:linear-gradient(90deg,#efc9d4,#f7dbe3);border:.5cqw solid #e48aa0}
.right{width:var(--D);height:var(--H);left:calc(var(--D)/-2);top:calc(var(--H)/-2);transform:rotateY(90deg) translateZ(calc(var(--W)/2));background:linear-gradient(90deg,#f7dbe3,#efc9d4);border:.5cqw solid #e48aa0}
.floor{width:var(--W);height:var(--D);left:calc(var(--W)/-2);top:calc(var(--D)/-2);transform:translateY(calc(var(--H)/2 - .3cqw)) rotateX(90deg);background:radial-gradient(circle at 50% 40%,#fde6ee,#f3b9ca)}
.rib{position:absolute;left:50%;top:0;bottom:0;width:8cqw;margin-left:-4cqw;background:linear-gradient(90deg,#c92b5d,#f0517f 50%,#c92b5d)}
.mascot{position:absolute;font-size:7cqw;line-height:1}
.mascot img{display:block;width:100%;height:auto}
.front .ml{left:10%;top:18%}.front .mr{right:10%;top:18%}
.front .mascot:not(:has(img)){font-size:6.5cqw}
.front .mascot:has(img){width:11cqw}
/* floor items */
.floor>*{transition:transform .6s cubic-bezier(.3,1.6,.5,1),opacity .5s;opacity:0;transform:scale(.2)}
.open .floor>*{opacity:1;transform:none}
.floor>*:nth-child(1){transition-delay:1.0s}.floor>*:nth-child(2){transition-delay:1.1s}.floor>*:nth-child(3){transition-delay:1.2s}.floor>*:nth-child(4){transition-delay:1.3s}.floor>*:nth-child(5){transition-delay:1.4s}.floor>*:nth-child(6){transition-delay:1.5s}.floor>*:nth-child(7){transition-delay:1.6s}.floor>*:nth-child(8){transition-delay:1.7s}
.pal{position:absolute;left:46%;top:8%;width:30%;height:34%;background:#f08fae;border:.5cqw solid #c9486d;border-radius:1cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:.8cqw;padding:1cqw;transform:rotate(-8deg)}
.pal i{border-radius:.5cqw}.pal i:nth-child(1){background:#f9d6df}.pal i:nth-child(2){background:#e1b36f}.pal i:nth-child(3){background:#c98f6a}.pal i:nth-child(4){background:#f4b4c6}.pal i:nth-child(5){background:#ea8aa6}.pal i:nth-child(6){background:#c9486d}
.spg{position:absolute;width:11cqw;height:11cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd6e3,#f27aa0);box-shadow:0 .8cqw 1cqw rgba(168,50,79,.35)}
.sp1{left:6%;top:10%}.sp2{left:22%;top:34%;width:9cqw;height:9cqw}.sp3{left:10%;top:48%;width:8cqw;height:8cqw}
.lip{position:absolute;width:3cqw;height:11cqw;border-radius:.8cqw;background:linear-gradient(#e8467c 0 40%,#e6c25c 40%);box-shadow:0 .6cqw .8cqw rgba(0,0,0,.25)}
.l1{left:80%;top:6%;transform:rotate(18deg)}.l2{left:86%;top:20%;transform:rotate(-14deg);height:9cqw}.l3{left:60%;top:48%;transform:rotate(80deg)}
.mini{position:absolute;left:38%;top:50%;font-size:9cqw;line-height:1;color:#e8467c;transform-origin:center}
/* lid */
.lidwrap{position:absolute;left:0;top:calc(var(--H)/-2);width:0;height:0;transform-style:preserve-3d;transform-origin:0 0;transform:translateZ(calc(var(--D)/-2 - var(--m))) rotateX(0deg);transition:transform 1.1s cubic-bezier(.4,1.4,.5,1)}
.open .lidwrap{transform:translateZ(calc(var(--D)/-2 - var(--m))) rotateX(106deg)}
.lt{position:absolute;left:calc(var(--W)/-2 - var(--m));top:0;width:calc(var(--W) + 2*var(--m));height:calc(var(--D) + 2*var(--m));transform-origin:0 0;transform:rotateX(90deg);transform-style:preserve-3d;backface-visibility:hidden;background:linear-gradient(#fff5f8,#fbe0e8);border:.5cqw solid #e9a9bb;border-radius:1.2cqw}
.lt .rb{position:absolute;background:linear-gradient(90deg,#c92b5d,#f0517f 50%,#c92b5d)}
.lt .rb1{left:0;right:0;top:50%;height:8cqw;margin-top:-4cqw;background:linear-gradient(#c92b5d,#f0517f 50%,#c92b5d)}
.lt .rb2{top:0;bottom:0;left:50%;width:8cqw;margin-left:-4cqw}
.bow{left:50%;top:50%;width:26cqw;transform-origin:50% 100%;transform:translate(-50%,-72%) rotateX(-62deg) translateZ(.5cqw);filter:drop-shadow(0 1cqw .8cqw rgba(120,20,60,.35))}
.ltxt{position:absolute;left:50%;top:70%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.75);padding:.6cqw 2.4cqw;border-radius:2cqw;font:700 5.2cqw/1.1 'Dancing Script',cursive;color:#c2335f}
.lt .mt{left:7%;top:62%}
.lt .mt:not(:has(img)){font-size:6cqw}.lt .mt:has(img){width:10cqw}
.lu{position:absolute;inset:0;transform:rotateX(180deg) translateZ(.15cqw);backface-visibility:hidden;border-radius:1.2cqw;background:linear-gradient(#e8467c,#f67aa2);outline:1cqw dotted #ffe27a;outline-offset:-2.2cqw}
.lu .heart{position:absolute;left:24%;top:9%;width:74%;height:84%}
.lu .heart svg{position:absolute;inset:0;width:100%;height:100%}
.lu .heart span{position:absolute;left:22%;right:22%;top:20%;text-align:center;font:700 3.9cqw/1.1 'Dancing Script',cursive;color:#a8244f}
.lu .mu{left:5%;top:34%}
.lu .mu:not(:has(img)){font-size:9cqw}.lu .mu:has(img){width:15cqw}
.lf,.ll,.lr,.lb{position:absolute;top:0;height:var(--L);background:linear-gradient(#fdeff3,#f5d3de);border:.5cqw solid #e9a9bb}
.lf{left:calc(var(--W)/-2 - var(--m));width:calc(var(--W) + 2*var(--m));transform:translateZ(calc(var(--D) + 2*var(--m)))}
.lb{left:calc(var(--W)/-2 - var(--m));width:calc(var(--W) + 2*var(--m))}
.ll,.lr{width:calc(var(--D) + 2*var(--m));transform-origin:0 0;transform:rotateY(-90deg);background:linear-gradient(90deg,#efc9d4,#f7dbe3)}
.ll{left:calc(var(--W)/-2 - var(--m))}.lr{left:calc(var(--W)/2 + var(--m))}
/* balloons + bubble */
.balloons{inset:0;pointer-events:none}
.balloon{position:absolute;left:50%;top:50cqw;width:13cqw;height:14.5cqw;border-radius:50% 50% 50% 50%/52% 52% 48% 48%;opacity:0;transform:translate(-50%,10cqw) scale(.3);
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0 6%,transparent 7%),var(--c);box-shadow:inset -1.6cqw -2cqw 3cqw rgba(0,0,0,.2)}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:.25cqw;height:14cqw;background:rgba(255,255,255,.85)}
.balloon.hb{background:none;box-shadow:none;font-size:15cqw;line-height:1;text-align:center;width:auto;height:auto;filter:drop-shadow(0 .6cqw .6cqw rgba(0,0,0,.2))}
.balloon.hb::after{top:85%;height:12cqw}
.open .balloon{animation:brise 1.9s var(--d) cubic-bezier(.2,.8,.3,1) both,baway 2.4s calc(var(--d) + 3.2s) ease-in forwards,bbob 3s calc(var(--d) + 1.9s) ease-in-out infinite alternate}
@keyframes brise{0%{opacity:0;transform:translate(-50%,10cqw) scale(.3)}15%{opacity:1}100%{opacity:1;transform:translate(calc(-50% + var(--x)*1cqw),calc(var(--y)*-1cqw)) scale(1)}}
@keyframes baway{from{opacity:1;transform:translate(calc(-50% + var(--x)*1cqw),calc(var(--y)*-1cqw))}to{opacity:0;transform:translate(calc(-50% + var(--x)*1cqw),calc((var(--y) + 90)*-1cqw))}}
@keyframes bbob{from{translate:0 0}to{translate:0 -2.4cqw}}
.stagehint{margin-top:18px;font:700 clamp(24px,2.6vw,40px) 'Dancing Script',cursive}
.msgbubble{margin-top:18px;max-width:94vw;background:#fff;border:3px solid #e8467c;border-radius:50px;padding:14px 30px;font:600 clamp(18px,1.8vw,28px) 'Fredoka';color:var(--deep);cursor:pointer;box-shadow:0 8px 22px rgba(232,70,124,.4);animation:pulse 1.6s ease-in-out infinite}
.msgoverlay{position:fixed;inset:0;z-index:20;background:rgba(120,30,60,.45);display:grid;place-items:center;padding:20px}
.msgcard{background:#fff7f8;border:4px solid #e8467c;border-radius:30px;padding:clamp(20px,3vw,48px);max-width:min(760px,94vw);max-height:92vh;overflow:auto;text-align:center;animation:fade .5s}
.msgcard h2{color:var(--pink);font-size:clamp(28px,3.4vw,52px);margin-bottom:14px}
.msgcard p{font:clamp(22px,2.2vw,34px)/1.4 'Patrick Hand',cursive;color:#5a2b2b;white-space:pre-line;margin-bottom:10px}

.photo{width:min(clamp(200px,28vw,440px),44vh*0.75*1.6);aspect-ratio:3/4;background:#fff;padding:14px 14px 56px;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.22);transform:rotate(var(--r));font:700 clamp(22px,2.4vw,38px) 'Dancing Script';color:var(--deep)}
.photo div{width:100%;height:100%;background:#f9d9e0 center 30%/cover;display:grid;place-items:center;font-size:48px;margin-bottom:6px}

@keyframes rise{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
@media(max-width:700px){.tulips{grid-template-columns:1fr;padding-top:50px}.bouquet{margin:auto;width:70vw}.nextbtn,.backbtn{padding:10px 22px;font-size:18px}.screen{justify-content:flex-start;padding-top:70px}.pad{grid-template-columns:repeat(3,64px)}.pad button{height:60px}.dot{width:48px;height:48px}}
</style>
</head>

<script>

const CONFIG = {

/* ==================================== */

const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');
  document.body.classList.toggle('soft',id!=='s-code');
  if(id==='s-gifts'&&typeof updateGifts==='function')updateGifts();};

// --- gift order: 1st gift, 3rd gift, 2nd gift, then the big one
const ORDER=[0,2,1,3];   // gift numbers (left to right = 0,1,2; big = 3)
let progress=0;           // how many gifts are unlocked
const giftBtns={};
function updateGifts(){
  Object.keys(giftBtns).forEach(g=>{const pos=ORDER.indexOf(+g);
    giftBtns[g].classList.toggle('locked',pos>progress);
    giftBtns[g].classList.toggle('next',pos===progress);
    giftBtns[g].classList.toggle('done',pos<progress);});
}
function openGift(g){
  const pos=ORDER.indexOf(g);
  if(pos>progress){const b=giftBtns[g];b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');return;}
  progress=Math.max(progress,pos+1);
  if(g===3&&typeof resetStage==='function')resetStage();
  show('s-'+g);burst(g===3?20:14);
}

function burst(n=26){const fx=$('fx');for(let i=0;i<n;i++){const h=document.createElement('i');
  h.textContent=['🎈','💖','🎉','✨','🎂','🎁','🌹'][i%7];h.style.left=Math.random()*100+'vw';
  h.style.fontSize=14+Math.random()*26+'px';h.style.animationDuration=3+Math.random()*3+'s';
  h.style.animationDelay=Math.random()*1.2+'s';fx.appendChild(h);setTimeout(()=>h.remove(),7500);}}

// --- code screen
let entered="";
$('hint').textContent=CONFIG.hint;
// polaroids around the keypad
(function(){
  const slots=[ // [side, x%, top%, rotation, far?]
    ['l',3,5,-8,0],['r',3,7,7,0],['l',15,29,6,1],['r',15,31,-6,1],
    ['l',3,52,5,0],['r',3,54,-7,0],['l',15,73,-5,1],['r',15,74,6,1]];
  (CONFIG.codePhotos||[]).slice(0,slots.length).forEach((src,i)=>{
    const [side,x,top,rot,far]=slots[i];const d=document.createElement('div');d.className='pol'+(far?' far':'');
    d.style[side==='l'?'left':'right']=x+'%';d.style.top=top+'%';
    d.style.setProperty('--r',rot+'deg');d.style.setProperty('--d',(0.15+i*0.12).toFixed(2)+'s');
    const im=document.createElement('img');im.src=src;im.alt='';d.appendChild(im);$('pbg').appendChild(d);});
})();
const L=CONFIG.code.length;
for(let i=0;i<L;i++){const d=document.createElement('div');d.className='dot';d.textContent='♥';d.style.color='#e0607f';$('dots').appendChild(d);}
function render(){[...$('dots').children].forEach((d,i)=>{d.classList.toggle('fill',i<entered.length);d.textContent=i<entered.length?'♥':'♡';});}
render();
function press(k){
  $('err').textContent='';
  if(k==='DEL'){entered=entered.slice(0,-1);}
  else if(/[\d.]/.test(k)&&entered.length<L){entered+=k;}
  render();
  if(entered.length===L){
    if(entered===CONFIG.code){setTimeout(()=>{show('s-gifts');burst(40);},250);}
    else{$('dots').classList.add('shake');$('err').textContent='Not quite… try again 💭';
      setTimeout(()=>{$('dots').classList.remove('shake');entered="";render();},500);}
  }
}
['1','2','3','4','5','6','7','8','9','.','0','DEL'].forEach(k=>{
  const b=document.createElement('button');b.textContent=k;
  b.onclick=()=>press(k);$('pad').appendChild(b);});
document.addEventListener('keydown',e=>{
  if(!$('s-code').classList.contains('active'))return;
  if(/^[\d.]$/.test(e.key))press(e.key);else if(e.key==='Backspace')press('DEL');});

// --- gifts
const giftSVG=(a,b,c,r1,r2)=>{const id=a.slice(1);return `<svg viewBox="0 0 200 200" aria-label="gift">
<defs>
<linearGradient id="L${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
<linearGradient id="R${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${r1}"/><stop offset="1" stop-color="${r2}"/></linearGradient>
</defs>
<ellipse cx="100" cy="188" rx="70" ry="9" fill="rgba(120,40,60,.18)"/>
<!-- box -->
<rect x="32" y="92" width="136" height="92" rx="8" fill="url(#L${id})" stroke="${c}" stroke-width="4"/>
<rect x="32" y="92" width="136" height="14" fill="rgba(0,0,0,.07)"/>
<!-- vertical ribbon -->
<rect x="86" y="92" width="28" height="92" fill="url(#R${id})" stroke="${c}" stroke-width="3"/>
<!-- lid -->
<rect x="22" y="66" width="156" height="34" rx="9" fill="url(#L${id})" stroke="${c}" stroke-width="4"/>
<rect x="30" y="72" width="140" height="7" rx="3.5" fill="rgba(255,255,255,.55)"/>
<rect x="86" y="66" width="28" height="34" fill="url(#R${id})" stroke="${c}" stroke-width="3"/>
<!-- bow -->
<path d="M100 66C70 14 28 36 56 62c14 10 34 6 44 4z" fill="url(#R${id})" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>
<path d="M100 66C130 14 172 36 144 62c-14 10-34 6-44 4z" fill="url(#R${id})" stroke="${c}" stroke-width="4" stroke-linejoin="round"/>
<path d="M62 52c8-10 20-14 30-8M138 52c-8-10-20-14-30-8" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round"/>
<path d="M96 70L78 104l14-6zM104 70l18 34-14-6z" fill="${r2}" stroke="${c}" stroke-width="3" stroke-linejoin="round"/>
<circle cx="100" cy="64" r="13" fill="url(#R${id})" stroke="${c}" stroke-width="4"/>
<!-- sparkles -->
<path d="M22 130l3 8 8 3-8 3-3 8-3-8-8-3 8-3zM178 112l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff" opacity=".85"/>
</svg>`;};
const giftStyles=[
  ['#bfe6f7','#7fc3e3','#3f7f9e','#ffc2cc','#ee8ea0'],
  ['#ffe3f0','#f7b0cc','#b8587a','#bfe6f7','#7fc3e3'],
  ['#e4d9ff','#b9a6f0','#6c58a8','#ffd9a8','#f4a95f']
];
CONFIG.giftLabels.forEach((t,i)=>{const b=document.createElement('button');b.className='gift';b.setAttribute('aria-label',t);
  const g=giftStyles[i%3];
  b.innerHTML=giftSVG(g[0],g[1],g[2],g[3],g[4]);b.onclick=()=>openGift(i);giftBtns[i]=b;$('gifts').appendChild(b);});

// --- main (big) gift on the gifts screen
const mg=document.createElement('button');mg.className='gift maingift';mg.setAttribute('aria-label','Main gift');
mg.innerHTML='<span class="halo"></span>'+giftSVG('#ffd6e3','#ff8fb3','#c2335f','#e8467c','#b01e4d')+'<span class="crown">👑</span><span class="sp">✨</span><span class="sp">💖</span><span class="sp">✨</span>';
mg.onclick=()=>openGift(3);giftBtns[3]=mg;$('mainrow').appendChild(mg);

// --- main gift page
document.querySelectorAll('.mascot').forEach((m,i)=>{m.innerHTML=CONFIG.mascotImg?`<img src="${CONFIG.mascotImg}" alt="">`:['💖','🎀'][i%2];});
$('ltxt').textContent=CONFIG.boxText;$('cardtxt').textContent=CONFIG.cardText;
$('finaltitle').textContent=CONFIG.finalTitle;$('finalmsg').textContent=CONFIG.finalMessage;$('msgbubble').textContent=CONFIG.bubbleText;
(function(){const cols=['#ff4d6d','#f7a8c4','#ffffff','#d98cf0','#e8c34a','#ff85a1','#c9a0ff','#f5f5f5'];const n=16;
  for(let i=0;i<n;i++){const b=document.createElement('div');b.className='balloon'+(i%6===2?' hb':'');
    if(b.classList.contains('hb'))b.textContent=['❤️','💗','💖'][i%3];
    b.style.setProperty('--c',cols[i%cols.length]);
    b.style.setProperty('--x',(-40+(i/(n-1))*80+(Math.random()*8-4)).toFixed(1));
    b.style.setProperty('--y',(14+Math.random()*34).toFixed(1));
    b.style.setProperty('--d',(0.5+i*0.07).toFixed(2)+'s');$('balloons').appendChild(b);}})();
let bubbleTimer=null;
function resetStage(){$('stage').classList.remove('open');$('msgbubble').hidden=true;$('stagehint').hidden=false;$('msgoverlay').hidden=true;clearTimeout(bubbleTimer);}
$('stage').onclick=e=>{const s=$('stage');if(e.target.closest('#msgbubble'))return;if(s.classList.contains('open'))return;
  s.classList.add('open');burst(80);$('stagehint').hidden=true;
  bubbleTimer=setTimeout(()=>{$('msgbubble').hidden=false;},3800);};
$('msgbubble').onclick=()=>{$('msgoverlay').hidden=false;burst(40);};
// "TURN AROUND BABE!" letters
(function(){let k=0;[['TURN AROUND'],['BABE!']].forEach(([line],ri)=>{const row=document.createElement('span');row.className='row2';
  [...line].forEach(ch=>{const s=document.createElement('span');s.className='l';s.textContent=ch;s.style.setProperty('--ld',(0.15+k*0.07).toFixed(2)+'s');k++;row.appendChild(s);});
  $('endtxt').appendChild(row);});})();
let endBursts=null;
$('msgclose').onclick=()=>{
  if($('wipe').classList.contains('go'))return;
  $('msgclose').disabled=true;
  $('wipe').className='wipe go';
  setTimeout(()=>{$('msgoverlay').hidden=true;stopMic();show('s-end');
    $('wipe').className='wipe out';burst(60);
    clearInterval(endBursts);endBursts=setInterval(()=>burst(8),1000);
    setTimeout(()=>{$('wipe').className='wipe';},950);},900);
};

// --- back buttons on every surprise page
// one big button on each gift page: back to the gifts to open the next one
const goLabels=['Open your next gift 🎁','Now open the BIG gift 🎁✨','Open your next gift 🎁'];
[0,1,2].forEach(i=>{const b=document.createElement('button');b.className='gobtn';b.textContent=goLabels[i];
  b.onclick=()=>show('s-gifts');$('s-'+i).appendChild(b);});

// --- tulips
$('t0').textContent=CONFIG.tulipsTitle;
[['bl',CONFIG.bubblesLeft],['br',CONFIG.bubblesRight]].forEach(([id,arr],c)=>arr.forEach((t,i)=>{
  const d=document.createElement('div');d.className='bubble';d.textContent=t;
  d.style.animationDelay=(i*.25+c*.12)+'s';$(id).appendChild(d);}));
// --- letter
$('t1').textContent=CONFIG.letterTitle;$('letter').textContent=CONFIG.letter;$('sign').textContent=CONFIG.signoff;
// --- cake: tap to blow out / relight candles
let micStream=null;
function stopMic(){if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null;}}
function setCandles(out){const c=$('cake');c.classList.toggle('out',out);
  if(out){$('blowhint').textContent='Happy 17th Birthday! 🎉 Did you make a wish? ✨';$('micbtn').textContent='🕯️ Light them again';burst(60);stopMic();}
  else{$('blowhint').textContent='Tap the cake 🕯️';$('micbtn').textContent='Blow the candles';}}
function openBlowNote(){if($('cake').classList.contains('out'))return;$('blowoverlay').hidden=false;burst(20);}
$('cake').onclick=openBlowNote;
$('micbtn').onclick=openBlowNote;
$('blowdone').onclick=()=>{$('blowoverlay').hidden=true;setCandles(true);};
const _oldMic=async()=>{
  try{
    micStream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(micStream).connect(an);
    const buf=new Uint8Array(an.fftSize);let base=0,n=0,loud=0;const t0=performance.now();
    $('blowhint').textContent='Now blow on the candles… 💨';
    (function loop(){
      if(!micStream){ctx.close();return;}
      an.getByteTimeDomainData(buf);let s=0;for(const v of buf){const d=(v-128)/128;s+=d*d;}
      const rms=Math.sqrt(s/buf.length);
      if(performance.now()-t0<700){base+=rms;n++;}
      else{const b=base/Math.max(n,1);loud=(rms>Math.max(.12,b*3))?loud+1:0;if(loud>12){ctx.close();setCandles(true);return;}}
      requestAnimationFrame(loop);})();
  }catch(e){$('blowhint').textContent='Mic not available – just tap the cake! 🎂';}
};
// leaving the letter page stops the mic
document.addEventListener('click',e=>{if(e.target.closest('.backbtn,.nextbtn'))stopMic();});
// --- photos
$('t2').textContent=CONFIG.photosTitle;
CONFIG.photos.forEach((p,i)=>{const d=document.createElement('div');d.className='photo';
  d.style.setProperty('--r',(i%2?3:-3)+'deg');
  d.innerHTML=`<div ${p.img?`style="background-image:url('${p.img}')"`:''}>${p.img?'':'📷'}</div>${p.caption}`;
  $('photos').appendChild(d);});

// --- next buttons: go to following surprise, then back to gifts
// Next goes straight to the next gift in ORDER
document.querySelectorAll('.nextbtn').forEach((b,i)=>b.onclick=()=>{
  const pos=ORDER.indexOf(i);openGift(ORDER[pos+1]);});
updateGifts();
</script>
